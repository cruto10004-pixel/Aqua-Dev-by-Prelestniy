name: Aqua Native Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths: ['android-native/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Check and build native APK
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Aqua-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Decode release signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.AQUA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Release requires AQUA_KEYSTORE_BASE64'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aqua-release.jks"
      - name: Build signed release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          AQUA_KEYSTORE: ${{ runner.temp }}/aqua-release.jks
          AQUA_STORE_PASSWORD: ${{ secrets.AQUA_STORE_PASSWORD }}
          AQUA_KEY_ALIAS: ${{ secrets.AQUA_KEY_ALIAS }}
          AQUA_KEY_PASSWORD: ${{ secrets.AQUA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: Aqua-release-apk
          path: android-native/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/aqua-release.jks"
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Aqua-release-apk
          path: apk
      - name: Publish versioned APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" apk/app-release.apk --title "Aqua $GITHUB_REF_NAME" --generate-notes
